<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tarefas{% endblock %} | Gestão de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='componentes.css') }}">
</head>
<body>
    <nav class="menu">
        <div class="menu-conteudo">
            <span class="menu-marca">Gestão de Tarefas</span>
            <a href="{{ url_for('tarefas') }}" {% if request.endpoint in ['tarefas', 'nova_tarefa', 'editar_tarefa'] %}class="ativo" aria-current="page"{% endif %}>Tarefas</a>
            <a href="{{ url_for('contatos') }}" {% if request.endpoint in ['contatos', 'novo_contato', 'editar_contato'] %}class="ativo" aria-current="page"{% endif %}>Contatos</a>
        </div>
    </nav>

    <main class="container">
        {% for categoria, texto in get_flashed_messages(with_categories=true) %}
            <p class="flash {{ categoria }}" role="status">{{ texto }}</p>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
